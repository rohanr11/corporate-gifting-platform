<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO: meta title & description placeholders — customize per deploy -->
    <title>Gilded & Grove | Premium Corporate Gifting</title>
    <meta
      name="description"
      content="Gilded & Grove designs premium corporate gifts, onboarding kits, and festive hampers for teams and clients — with an AI assistant that finds the perfect gift for your budget and occasion."
    />
    <link rel="canonical" href="https://www.gildedandgrove.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gilded & Grove | Premium Corporate Gifting" />
    <meta property="og:description" content="AI-powered corporate gifting for onboarding, leadership, and festive occasions." />
    <meta property="og:url" content="https://www.gildedandgrove.com/" />
    <meta property="og:image" content="/og-image.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gilded & Grove | Premium Corporate Gifting" />
    <meta name="twitter:description" content="Corporate gifting for onboarding, leadership, and festive occasions." />

    <!-- Organization JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Gilded & Grove",
        "url": "https://www.gildedandgrove.com",
        "logo": "https://www.gildedandgrove.com/logo.png",
        "description": "Premium AI-powered corporate gifting platform."
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
